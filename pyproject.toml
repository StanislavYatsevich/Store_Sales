[tool.poetry]
name = "store-sales"
version = "0.1.0"
description = "This task is aimed at stores' sales prediction"
authors = ["Stas <Stas20042701@gmail.com>"]
readme = "README.md"
packages = [{include = "store_sales", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12.3"
numpy = "^1.26.4"
pandas = "^2.2.2"
scikit-learn = "^1.4.2"
matplotlib = "^3.8.4"
lightgbm = "^4.3.0"
plotly = "^5.22.0"
streamlit = "^1.35.0"
click = "^8.1.7"
ruff = "^0.4.9"
black = "^24.4.2"
optuna = "^3.6.1"
mlflow = "^2.15.1"
setuptools = "^73.0.1"
ipykernel = "^6.29.4"
fastapi = "^0.115.0"
uvicorn = "^0.31.0"

[tool.poetry.scripts]
split_and_prepare_data = "store_sales.scripts.split_and_prepare_data:split_and_prepare_data"
add_new_features = "store_sales.scripts.add_new_features:add_new_features"
save_and_log_data = "store_sales.scripts.save_and_log_data:save_and_log_data"

[tool.poetry.group.dev.dependencies]
nbformat = "^5.10.4"
seaborn = "^0.13.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
